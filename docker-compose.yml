services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app

  ui-tests:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./reports:/reports

  api-tests:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./reports:/reports
