name: Multi Job CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Playwright suite in Docker
        run: docker compose up --build --abort-on-container-exit --exit-code-from ui-tests app ui-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: reports/ui/

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PyTest suite in Docker
        run: docker compose up --build --abort-on-container-exit --exit-code-from api-tests app api-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: reports/api/
